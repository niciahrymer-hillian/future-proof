{% extends "base.html" %}
{% block title %}Edit: {{ note.title }}{% endblock %}
{% block content %}
<h1>Edit note</h1>
{% if error %}
<div class="error">{{ error }}</div>
{% endif %}
<div class="card">
  <form method="post" action="/notes/{{ note.id }}/edit">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ note.title }}" autofocus required>
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content" required>{{ note.content }}</textarea>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="/notes/{{ note.id }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
