{% extends "base.html" %}
{% block title %}Sign Up - The Handy Dandy Notebook{% endblock %}
{% block content %}
<div style="max-width:420px;margin:3rem auto;">
  <h1 class="brand-70s" style="margin-bottom:0.2rem;">Join The Handy Dandy Notebook</h1>
  <p style="color:#8a6b5a;margin-bottom:1rem;font-family:Georgia, 'Times New Roman', serif;font-style:italic;">Create your account and start collecting your ideas.</p>

  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
    <a href="/login" class="btn btn-secondary" style="flex:1;justify-content:center;"><i class="fa-solid fa-right-to-bracket"></i> Sign in</a>
    <a href="/register" class="btn btn-primary" style="flex:1;justify-content:center;"><i class="fa-solid fa-user-plus"></i> Sign up</a>
  </div>

  {% if error %}
  <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
  {% endif %}

  <div class="card" style="margin-top:1rem;">
    <form method="post" action="/register">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Password (8+ characters)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-user-plus"></i> Create account</button>
    </form>
  </div>
</div>
{% endblock %}
