{% extends "base.html" %}
{% block title %}Reset Password - The Handy Dandy Notebook{% endblock %}
{% block content %}
<div style="max-width:460px;margin:3rem auto;">
  <h1 class="brand-70s" style="margin-bottom:0.2rem;">Reset your password</h1>
  <p style="color:#8a6b5a;margin-bottom:1rem;font-family:Georgia, 'Times New Roman', serif;font-style:italic;">
    Validate your account with your password hint, then choose a new password.
  </p>

  <div style="display:flex;gap:0.5rem;margin-bottom:1rem;">
    <a href="/login" class="btn btn-secondary" style="flex:1;justify-content:center;"><i class="fa-solid fa-right-to-bracket"></i> Back to sign in</a>
  </div>

  {% if error %}
  <div class="error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
  {% endif %}

  <div class="card" style="margin-top:1rem;">
    <form method="post" action="/forgot-password">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label for="password_hint">Password hint</label>
        <input type="text" id="password_hint" name="password_hint" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="new_password">New password (8+ characters)</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;"><i class="fa-solid fa-key"></i> Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
