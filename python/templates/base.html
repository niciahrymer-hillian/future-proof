<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Handy Dandy Notebook{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chicle&family=Fascinate&family=Monoton&family=Oi&family=Ranchers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream-bg: #FFE0BB;
      --cream-surface: #FFF6E9;
      --accent-coral: #EC906A;
      --accent-orange: #F4914E;
      --accent-gold: #DEB158;
      --soft-brown: #7A533D;
      --dark-brown: #5B3E2C;
      --muted-brown: #8E6A55;
      --border-warm: #E6C79A;
      --danger: #C55A3D;
      --danger-dark: #973E27;
      --tag-bg: #FFE8C8;
    }
    body {
      font-family: Tahoma, Verdana, sans-serif;
      background-color: var(--cream-bg);
      background-image:
        radial-gradient(circle at 20% 15%, rgba(244, 145, 78, 0.18) 0%, rgba(244, 145, 78, 0) 28%),
        radial-gradient(circle at 85% 5%, rgba(236, 144, 106, 0.18) 0%, rgba(236, 144, 106, 0) 22%),
        radial-gradient(circle at 70% 85%, rgba(222, 177, 88, 0.16) 0%, rgba(222, 177, 88, 0) 25%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.1) 0px, rgba(255, 255, 255, 0.1) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 7px);
      color: var(--dark-brown);
      line-height: 1.6;
      transition: background-image 0.2s ease, background-color 0.2s ease;
    }
    body.theme-soft {
      background-image:
        radial-gradient(circle at 20% 15%, rgba(244, 145, 78, 0.12) 0%, rgba(244, 145, 78, 0) 30%),
        radial-gradient(circle at 85% 5%, rgba(236, 144, 106, 0.1) 0%, rgba(236, 144, 106, 0) 24%),
        radial-gradient(circle at 70% 85%, rgba(222, 177, 88, 0.1) 0%, rgba(222, 177, 88, 0) 28%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.07) 0px, rgba(255, 255, 255, 0.07) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 8px);
    }
    body.theme-soft .card {
      box-shadow: 0 2px 6px rgba(133, 96, 72, 0.09);
    }
    body.theme-soft nav {
      box-shadow: 0 3px 8px rgba(123, 73, 45, 0.18);
    }
    body.theme-bold {
      background-image:
        radial-gradient(circle at 20% 15%, rgba(244, 145, 78, 0.24) 0%, rgba(244, 145, 78, 0) 26%),
        radial-gradient(circle at 85% 5%, rgba(236, 144, 106, 0.24) 0%, rgba(236, 144, 106, 0) 20%),
        radial-gradient(circle at 70% 85%, rgba(222, 177, 88, 0.22) 0%, rgba(222, 177, 88, 0) 22%),
        repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.13) 0px, rgba(255, 255, 255, 0.13) 2px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0) 6px);
    }
    body.theme-bold .card {
      box-shadow: 0 5px 14px rgba(133, 96, 72, 0.16);
    }
    body.theme-bold nav {
      box-shadow: 0 6px 14px rgba(123, 73, 45, 0.28);
    }
    .container { max-width: 800px; margin: 0 auto; padding: 1rem 1.5rem; }
    nav {
      background: linear-gradient(135deg, var(--accent-orange) 0%, var(--accent-coral) 55%, #CE7A58 100%);
      color: #fff7ef;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      box-shadow: 0 4px 10px rgba(123, 73, 45, 0.24);
    }
    nav a {
      color: #fff6e7;
      text-decoration: none;
      font-style: italic;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 600;
      transition: color 0.15s ease, transform 0.15s ease;
    }
    nav a:hover {
      color: #FFE0BB;
      text-decoration: underline;
      transform: translateY(-1px);
    }
    nav .spacer { flex: 1; }
    nav span { font-size: 0.9rem; opacity: 0.9; }
    h1, h2 {
      font-family: Georgia, 'Times New Roman', serif;
      margin: 1.25rem 0 0.75rem;
      color: var(--soft-brown);
    }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.2rem; margin-top: 1rem; margin-bottom: 0.5rem; }
    a { color: var(--soft-brown); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.48rem 1.08rem;
      border-radius: 999px;
      border: 2px solid rgba(91, 62, 44, 0.25);
      cursor: pointer;
      font-size: 0.95rem;
      text-decoration: none;
      font-family: Tahoma, Verdana, sans-serif;
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(91, 62, 44, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(91, 62, 44, 0.25);
    }
    .btn-primary { background: linear-gradient(180deg, var(--accent-orange), #E97E3B); color: #fffaf4; }
    .btn-primary:hover { background: linear-gradient(180deg, #E87A35, #D96D2B); }
    .btn-danger { background: var(--danger); color: #fff7f4; }
    .btn-danger:hover { background: var(--danger-dark); }
    .btn-secondary { background: linear-gradient(180deg, #F3D8B6, #EBCB9E); color: var(--dark-brown); }
    .btn-secondary:hover { background: linear-gradient(180deg, #EBCB9E, #DEB98B); }
    .card {
      background: var(--cream-surface);
      border: 1px solid var(--border-warm);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(133, 96, 72, 0.12);
      padding: 1rem 1.25rem;
      margin-bottom: 0.85rem;
    }
    .card-title { font-weight: 600; font-size: 1.05rem; }
    .card-meta { font-size: 0.82rem; color: var(--muted-brown); margin-top: 0.2rem; }
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--soft-brown);
      border: 1px solid #E5BE7D;
      border-radius: 3px;
      padding: 0.1rem 0.45rem;
      font-size: 0.8rem;
      margin-right: 0.3rem;
    }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.3rem; font-size: 0.92rem; }
    input[type=text], input[type=password], textarea {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border: 1px solid #d7c5b1;
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: Tahoma, Verdana, sans-serif;
      background: #fffefb;
      color: var(--dark-brown);
    }
    input[type=text]:focus, input[type=password]:focus, textarea:focus {
      outline: 2px solid #edb376;
      border-color: transparent;
    }
    textarea { min-height: 160px; resize: vertical; }
    .error {
      background: #FFF0E7;
      color: var(--danger-dark);
      border-left: 4px solid var(--danger);
      padding: 0.6rem 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }
    .actions { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; align-items: center; }
    .preview { color: #6d5548; font-size: 0.9rem; margin-top: 0.3rem; white-space: pre-wrap; }
    .empty-hint { color: #8a6b5a; font-style: italic; margin-top: 2rem; text-align: center; }
    .menu-item-italic { font-style: italic; }
    .brand-70s {
      font-family: 'Fascinate', 'Chicle', 'Ranchers', 'Monoton', 'Oi', cursive;
      letter-spacing: 0.04em;
      color: var(--soft-brown);
      text-shadow: 2px 2px 0 #FFD7A8;
    }
    .theme-toggle {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 50;
      border-radius: 999px;
      border: 2px solid rgba(91, 62, 44, 0.3);
      background: linear-gradient(180deg, #F8DFC0, #EFC99D);
      color: var(--dark-brown);
      padding: 0.5rem 0.9rem;
      font-family: Tahoma, Verdana, sans-serif;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(91, 62, 44, 0.25);
    }
    .theme-toggle:hover {
      background: linear-gradient(180deg, #F4D4AD, #E8BB8A);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(91, 62, 44, 0.25);
    }
    @media (max-width: 640px) {
      .theme-toggle {
        right: 0.7rem;
        bottom: 0.7rem;
        padding: 0.45rem 0.75rem;
      }
    }
  </style>
</head>
<body>

{% if request.session.get("username") %}
<nav>
  <a href="/"><i class="fa-solid fa-book-open"></i> <span class="menu-item-italic">The Handy Dandy Notebook</span></a>
  <a href="/notes/new"><i class="fa-solid fa-plus"></i> <span class="menu-item-italic">New</span></a>
  <a href="/search"><i class="fa-solid fa-magnifying-glass"></i> <span class="menu-item-italic">Search</span></a>
  <span class="spacer"></span>
  <span>{{ request.session.get("username") }} ({{ request.session.get("role") }})</span>
  <form method="post" action="/logout" style="display:inline">
    <button type="submit" style="background:none;border:none;color:#ffe6c7;cursor:pointer;font-size:0.9rem;font-style:italic;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </form>
</nav>
{% endif %}

<div class="container">
{% block content %}{% endblock %}
</div>

<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme intensity">
  <i class="fa-solid fa-circle-half-stroke"></i> Intensity: Bold
</button>

<script>
  (function () {
    const storageKey = "handy-dandy-theme-intensity";
    const toggle = document.getElementById("theme-toggle");
    const body = document.body;
    if (!toggle || !body) return;

    const validModes = ["soft", "bold"];
    const saved = localStorage.getItem(storageKey);
    const initial = validModes.includes(saved) ? saved : "bold";

    function apply(mode) {
      body.classList.remove("theme-soft", "theme-bold");
      body.classList.add("theme-" + mode);
      toggle.innerHTML = '<i class="fa-solid fa-circle-half-stroke"></i> Intensity: ' + (mode === "soft" ? "Soft" : "Bold");
      localStorage.setItem(storageKey, mode);
    }

    toggle.addEventListener("click", function () {
      const next = body.classList.contains("theme-soft") ? "bold" : "soft";
      apply(next);
    });

    apply(initial);
  })();
</script>

</body>
</html>
